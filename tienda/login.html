<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <header>
        <h1>Aura Shop</h1>
        <nav>
            <a href="../index.html">Home</a>
            <a href="productos.html">Productos</a>
            <a href="nosotros.html">Nosotros</a>

        </nav>
    </header>

    <main class="contenedor-login">
        <h2>Inicio de sesión</h2>
        <form id="formLogin">
            <div class="grupo-login">
                <label for="correo">Correo:</label>
                <input type="text" id="correo" name="correo" class="input-login" placeholder="usuario@duoc.cl">
                <span id="errorCorreo" style="color: red; display: none; font-size: 12px;"></span>
            </div>
            
            <div class="grupo-login">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" class="input-login">
                <span id="errorPassword" style="color: red; display: none; font-size: 12px;"></span>
            </div>
            
            <button type="submit" class="btn-login">Iniciar sesión</button>
        </form>
    </main>

    <footer>

    </footer>

    <script src="../js/login.js"></script>
</body>
