<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Aura Shop</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <header>
        <h1>Aura Shop</h1>
        <nav>
            <a href="../index.html">Home</a>
            <a href="productos.html">Productos</a>
            <a href="nosotros.html">Nosotros</a>
            <a href="blogs.html">Blogs</a>
            <a href="contacto.html">Contacto</a>
            <a href="login.html">Iniciar Sesion</a>
            <a href="carrito.html">Carrito</a>
        </nav>
    </header>

    <main style="padding: 20px; max-width: 400px; margin: auto;">
        <h2>Inicio de sesión</h2>
        <form id="formLogin">
            <div style="margin-bottom: 15px;">
                <label for="correo">Correo:</label><br>
                <input type="text" id="correo" name="correo" maxlength="100" placeholder="usuario@duoc.cl" style="width: 100%; padding: 8px;">
                <span id="errorCorreo" style="color: red; display: none; font-size: 12px;"></span>
            </div>
            <div style="margin-bottom: 15px;">
                <label for="password">Contraseña:</label><br>
                <input type="password" id="password" name="password" style="width: 100%; padding: 8px;">
                <span id="errorPassword" style="color: red; display: none; font-size: 12px;"></span>
            </div>
            <button type="submit" style="padding: 10px 20px; cursor: pointer;">Iniciar sesión</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Aura Shop. Todos los derechos reservados.</p>
    </footer>

    <script src="../js/login.js"></script>
</body>
</html>
