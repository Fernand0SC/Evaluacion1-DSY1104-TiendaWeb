<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Carrito - Aura Shop</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <header>
        <h1>Aura Shop</h1>
        <nav>
            <a href="../index.html">Home</a>
            <a href="productos.html">Productos</a>
            <a href="nosotros.html">Nosotros</a>
            <a href="blogs.html">Blogs</a>
            <a href="contacto.html">Contacto</a>
            <a href="login.html">Iniciar Sesion</a>
            <a href="carrito.html">Carrito</a>
            <a href="registro.html">Registrarse</a>
        </nav>
    </header>

    <main style="padding: 20px; max-width: 800px; margin: auto;">
        <h2>Mi carrito de compras</h2>
        
        <!-- Contenedor vacío donde el JavaScript pintará los productos -->
        <div id="contenedorCarrito" style="margin-top: 20px; border: 1px solid #ddd; padding: 15px; border-radius: 8px;">
        </div>

        <div style="margin-top: 30px; text-align: right;">
            <h3>TOTAL: $<span id="precioTotal">0</span></h3>
            <button style="padding: 10px 20px; background: #28a745; color: white; border: none; cursor: pointer; font-size: 16px;">Ir a Pagar</button>
            <button onclick="vaciarCarrito()" style="padding: 10px 20px; background: #dc3545; color: white; border: none; cursor: pointer; font-size: 16px; margin-left: 10px;">Vaciar Carrito</button>
        </div>
    </main>

    <!-- Conectado al JavaScript del carrito -->
    <script src="../js/carrito.js"></script>
</body>
</html>
