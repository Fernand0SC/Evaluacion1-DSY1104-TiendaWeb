<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Usuario - Aura Shop Admin</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/admin-style.css">
</head>
<body>
    <div class="admin-layout">
        <aside class="sidebar">
            <div class="brand">
                <h3>Aura Admin</h3>
            </div>
            <nav class="admin-menu">
                <ul>
                    <li><a href="admin-home.html">Dashboard</a></li>
                    <li><a href="admin-producto-nuevo.html">Nuevo Producto</a></li>
                    <li><a href="admin-producto-editar.html">Editar Producto</a></li>
                    <li><a href="admin-producto-detalle.html">Detalle Producto</a></li>
                    <li><a href="admin-usuario-detalle.html">Detalle Usuarios</a></li>
                    <li><a href="admin-productos.html">Ver todos los productos</a></li>
                    <li><a href="admin-usuarios.html">Ver todos los usuarios</a></li>
                    <li><a href="admin-usuario-nuevo.html"class="active">Añadir nuevo Usuario Admin</a></li>
                    <li><a href="admin-editar-usuario.html">Editar Usuario Admin</a></li>
                    <li><a href="../index.html" class="btn-logout">Cerrar Sesión</a></li>
                </ul>
            </nav>
                
            
        </aside>
        <main class="main-content">
            <header class="top-header">
                <h2>Crear Nuevo Usuario</h2>
                <span>Panel de Control</span>
            </header>
            <section class="content-area">
                <form id="formularioNuevoUsuario" class="admin-form">
                    <div class="form-group">
                        <label for="nuevoRun">RUN (Sin puntos ni guion):</label>
                        <input type="text" id="nuevoRun" placeholder="Ej: 19011022K">
                        <span id="errorNuevoRun" style="color: red; display: none; font-size: 12px;"></span>
                    </div>

                    <div class="form-group">
                        <label for="nuevoNombre">Nombre Completo:</label>
                        <input type="text" id="nuevoNombre"placeholder="Nombre completo">
                        <span id="errorNuevoNombre" style="color: red; display: none; font-size: 12px;"></span>
                    </div>

                    <div class="form-group">
                        <label for="nuevoCorreo">Correo Electrónico:</label>
                        <input type="email" id="nuevoCorreo"placeholder="correo@duoc.cl">
                        <span id="errorNuevoCorreo" style="color: red; display: none; font-size: 12px;"></span>
                    </div>

                    <div class="form-group">
                        <label for="nuevoPassword">Contraseña (4 a 10 caracteres):</label>
                        <input type="password" id="nuevoPassword" placeholder="••••••••">
                        <span id="errorNuevoPassword" style="color: red; display: none; font-size: 12px;"></span>
                    </div>

                    <div class="form-group">
                        <label for="nuevoRol">Tipo / Rol:</label>
                        <select id="nuevoRol">
                            <option value="">-- Seleccione Rol --</option>
                            <option value="admin">Administrador</option>
                            <option value="cliente">Cliente</option>
                        </select>
                        <span id="errorNuevoRol" style="color: red; display: none; font-size: 12px;"></span>
                    </div>
                    <button type="submit" class="btn-submit">Guardar Usuario</button>
                </form>
            </section>
        </main>
    </div>
    <script src="../js/validaciones-admin.js"></script>
</body>
</html>
